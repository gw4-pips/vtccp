// ── v1.37 probe: DebugApplicationStdArray ────────────────────────────────────
// q.applicationStdArray appeared as [arr.13] in v1.36 DebugQTopKeys on the
// GS1 4-AI pharma scan.  13 entries for 4 AIs suggests ~3 sub-fields per AI
// element (e.g. ai, value, pass/fail).
//
// This probe emits: len=N followed by sub-key dump of first 6 elements.
// Expected on GS1 code:  len=13|[0]=ai=01;value=...;pass=...;|[1]=...
// Expected on non-GS1:   len=-1  (array absent)
// Expected on GS1 no-parser: len=0  (array present but empty)
//
// Variable note: _ai already used for AIM ID above; using _asa* prefix here.
var _asa=pk(q,&quot;applicationStdArray&quot;);
var _asaLen=(_asa&amp;&amp;typeof _asa.length!==&quot;undefined&quot;)?_asa.length:-1;
var _asaDiag=&quot;len=&quot;+_asaLen;
if(_asa&amp;&amp;_asaLen&gt;0){
  var _asaLim=(_asaLen&lt;6)?_asaLen:6;
  for(var _asai=0;_asai&lt;_asaLim;_asai++){
    _asaDiag+=&quot;|[&quot;+_asai+&quot;]=&quot;+ekv(_asa[_asai],&quot;elem&quot;+_asai);
  }
}
o+=elem(&quot;DebugApplicationStdArray&quot;,_asaDiag);
